name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest interpreter the package metadata claims.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # VideoCodecArtifacts encodes with real ffmpeg. Without the binary its
      # tests skip rather than fail, so a runner that lacks it reports green
      # while testing none of that transform.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        # The same four trees the README tells contributors to lint; `docs`
        # and `scripts` hold code the tests import and execute.
        run: ruff check src tests docs scripts

      - name: mypy
        run: mypy src/weathermentations

      - name: pytest
        # Depth-conditioned effects require CUDA (Phase 2+); those tests are
        # marked and skipped automatically on this CPU-only runner.
        run: pytest tests -q
