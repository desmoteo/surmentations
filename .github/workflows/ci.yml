name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The oldest and the newest interpreter the package metadata claims.
        python-version: ["3.10", "3.12"]
        include:
          # The native kernels' arm64 build has one tier, compiled by another
          # back end of the compiler, and no machine of the developers'.
          - os: ubuntu-24.04-arm
            python-version: "3.12"
    env:
      # The editable install below compiles native/*.c. Here a failure to do
      # so is an error, not the silent fall back to numpy a user gets.
      WEATHERMENTATIONS_BUILD_NATIVE: require
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # VideoCodecArtifacts encodes with real ffmpeg. Without the binary its
      # tests skip rather than fail, so a runner that lacks it reports green
      # while testing none of that transform.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        # The same trees the README tells contributors to lint; `docs` and
        # `scripts` hold code the tests import and execute.
        run: ruff check src tests docs scripts hatch_build.py

      - name: Native kernels are built, and every tier agrees
        # The hashes are compared by the tests on this machine; printing them
        # lets the x86-64 and arm64 jobs be compared with each other.
        run: |
          python -c "from weathermentations import _native as n; assert n.available(); print(n.tier(), n.tiers())"
          sh native/check/run.sh

      - name: mypy
        run: mypy src/weathermentations

      - name: pytest
        # Depth-conditioned effects require CUDA (Phase 2+); those tests are
        # marked and skipped automatically on this CPU-only runner.
        run: pytest tests -q

      - name: pytest without the native kernels
        # What an install with no C compiler runs: the numpy code alone.
        run: WEATHERMENTATIONS_NATIVE=0 pytest tests -q
