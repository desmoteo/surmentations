name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src/weathermentations

      - name: pytest
        # Depth-conditioned effects require CUDA (Phase 2+); those tests are
        # marked and skipped automatically on this CPU-only runner.
        run: pytest tests -q
