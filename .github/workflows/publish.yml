name: Publish to PyPI

# Manual trigger only: publishing is a one-way, externally-visible action, so
# it never runs on a plain push/merge — only when a maintainer explicitly
# pushes a `v*` tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or runs
# this workflow by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        # A pure-Python wheel, without the native kernels: a wheel holding
        # them is tagged for this runner's platform (linux_x86_64), which
        # PyPI does not accept. Publishing binary wheels needs a cibuildwheel
        # job (docs/native_kernels.md, "Not done"); until then a user gets
        # the kernels by installing from the sdist with a C compiler present.
        env:
          WEATHERMENTATIONS_BUILD_NATIVE: "0"
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
