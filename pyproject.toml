[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weathermentations"
version = "0.1.0"
description = "Physically-grounded weather and lens artifact augmentations for Albumentations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "the weathermentations authors" }]
keywords = [
    "albumentations",
    "data-augmentation",
    "computer-vision",
    "weather-simulation",
    "monocular-depth",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # 2.0 is the real floor, not a preference: the InitSchema validators
    # (`check_range_bounds`), per-transform seeding (`py_random`,
    # `random_generator`) and `get_params_dependent_on_data` this library is
    # built on do not exist in 1.4.x in the form used here, and the package
    # fails at import or construction on every 1.4 release tried (1.4.0,
    # 1.4.21, 1.4.24). Verified working on 2.0.0, 2.0.4 and 2.0.8.
    "albumentations>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "torch>=2.1",
    "transformers>=4.40",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Used by docs/generate_examples.py and scripts/benchmark.py, not by the
    # library itself.
    "tqdm>=4.60",
]

# No [project.urls] section yet — fill in Homepage/Repository once this
# project has an actual git remote to point to.

[tool.hatch.build.targets.wheel]
packages = ["src/weathermentations"]

# Compiles native/*.c into the package if there is a C compiler, and goes on
# without it if there is not: see hatch_build.py and docs/native_kernels.md.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
